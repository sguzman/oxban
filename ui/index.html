<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Oxban</title>

    <link data-trunk rel="css" href="assets/css/tokens.css" />
    <link data-trunk rel="css" href="assets/css/base.css" />
    <link data-trunk rel="css" href="assets/css/kanban.css" />
    <link data-trunk rel="css" href="assets/css/modal.css" />

    <script>
      window.quackbanInvoke = async (cmd, args) => {
        const internalInvoke = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
        if (typeof internalInvoke === "function") {
          return await internalInvoke(cmd, args);
        }

        const globalInvoke =
          window.__TAURI__ &&
          window.__TAURI__.core &&
          window.__TAURI__.core.invoke;
        if (typeof globalInvoke === "function") {
          return await globalInvoke(cmd, args);
        }

        const message = "Tauri invoke bridge is not available";
        console.error(message, {
          hasInternals: !!window.__TAURI_INTERNALS__,
          hasGlobal: !!window.__TAURI__,
          hasGlobalCore: !!(window.__TAURI__ && window.__TAURI__.core),
          location: window.location && window.location.href
        });
        throw new Error(message);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
